; PHP is not obliged to advertise its version, and it re-adds X-Powered-By at
; the SAPI level after the framework has built its response headers. Removing
; the header from the Response object therefore cannot suppress it, so this has
; to be switched off here. It is read automatically by CGI and FastCGI SAPIs,
; which is what shared hosting and cPanel run. The CLI server used by
; `php artisan serve` ignores this file, which is fine for local development.

expose_php = Off

; Campus events accept a video of up to 100MB alongside up to ten images, and
; the stock PHP limits (8M upload, 2M post) reject a larger body before
; Laravel ever sees it: no validation error is raised, the video field simply
; arrives empty. The margin above 100M is what lets a file of exactly 100MB
; through, and post_max_size has to clear the upload because it counts the
; whole multipart body. The 12M/25M the CLI server reports is a machine
; setting, not this file, so `php artisan serve` still caps uploads lower.
upload_max_filesize = 105M
post_max_size = 110M
